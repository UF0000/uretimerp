# main dalına supabase/migrations/ altında değişiklik gönderildiğinde:
#   1) migration'lar önce simülasyon (test) veritabanına uygulanır,
#   2) bir simülasyon turu çalışır (her bölüm kendi rol hesabıyla; hata varsa durur),
#   3) ikisi de başarılıysa canlı Supabase veritabanına uygulanır.
# Gerekli repository secret'ları: SIM_ENV, SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID
name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: # Actions sekmesinden elle de çalıştırılabilir

# Aynı anda iki migration çalışması olmasın
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  # 1-2) Test veritabanı: migration + simülasyon turu (kapı)
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIM_ENV: ${{ secrets.SIM_ENV }}
    steps:
      - name: SIM_ENV kontrolü
        run: |
          if [ -z "$SIM_ENV" ]; then echo "SIM_ENV secret'ı yok; canlıya geçilmez."; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test veritabanına uygula
        run: node scripts/sim/apply-migrations.mjs

      - name: Simülasyon turu (hata varsa canlıya geçilmez)
        run: node scripts/sim/run.mjs --hours=1 --strict

  # 3) Canlı veritabanı
  migrate:
    needs: test-db
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Sürüm sabit: "latest" GitHub API'ye sorulur ve istek sınırına takılabiliyor
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Projeye bağlan
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Uygulanacak migration'lar
        run: supabase migration list

      - name: Migration'ları uygula
        run: supabase db push
